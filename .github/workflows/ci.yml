name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-with-minimum-length
          ENCRYPTION_KEY: ci-encryption-key-with-minimum-length
          APP_URL: http://localhost:3000
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000

  migration-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalforge
          POSTGRES_PASSWORD: signalforge
          POSTGRES_DB: signalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge

      # Apply all committed migrations to a fresh database, then diff that
      # database against schema.prisma. Any schema change without a matching
      # migration (the bug that caused the CampaignLead override-column 500s)
      # makes the diff non-empty and fails CI with exit code 2.
      - name: Apply migrations
        working-directory: packages/database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge

      - name: Check schema matches migrations (no drift)
        working-directory: packages/database
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge

  container-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t signalforge-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t signalforge-web:ci --build-arg NEXT_PUBLIC_API_URL=/api .

      - name: Build Workers image
        run: docker build -f workers/Dockerfile -t signalforge-workers:ci .
