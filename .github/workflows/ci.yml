name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://signalforge:signalforge@localhost:5432/signalforge
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-with-minimum-length
          ENCRYPTION_KEY: ci-encryption-key-with-minimum-length
          APP_URL: http://localhost:3000
          API_URL: http://localhost:4000
          NEXT_PUBLIC_API_URL: http://localhost:4000

  container-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t signalforge-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t signalforge-web:ci --build-arg NEXT_PUBLIC_API_URL=/api .

      - name: Build Workers image
        run: docker build -f workers/Dockerfile -t signalforge-workers:ci .
