# SignalForge — Production Docker Compose
# Usage:
#   1. Copy .env.production.example to .env.production and fill in values
#   2. docker compose -f docker-compose.prod.yml build
#   3. docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
#   4. docker compose -f docker-compose.prod.yml up -d
#
# Memory budget (4GB VPS guideline):
#   postgres: 1GB, redis: 512MB, api: 512MB, nginx: 64MB
#   Each worker: 128MB — disable non-essential workers on small VPS
#
# Frontend is deployed to Vercel; this compose file runs API + workers only.

services:
  # ── Data Services ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-signalforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-signalforge} -d ${POSTGRES_DB:-signalforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signalforge-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', '--appendonly', 'yes', '--maxmemory', '384mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application Services ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: signalforge-api:latest
    container_name: signalforge-api
    restart: unless-stopped
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: signalforge-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      # Uncomment after provisioning TLS certs with certbot:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Workers (shared image, different commands) ───────────────────────────────
  email-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    image: signalforge-workers:latest
    container_name: signalforge-email-worker
    restart: unless-stopped
    command: ['node', 'workers/email-worker/dist/index.js']
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 128M

  scheduler-worker:
