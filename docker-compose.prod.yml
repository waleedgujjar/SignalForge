    image: gosom/google-maps-scraper:v1.15.0
    container_name: signalforge-google-maps-scraper
    restart: unless-stopped
    command: ['-web', '-data-folder', '/gmapsdata']
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
