# SignalForge — Production Docker Compose
# Usage:
#   1. Copy .env.production.example to .env.production and fill in values
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production build
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
#   4. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Lean deployment (4GB VPS):
#   Default profile starts 10 services (~2,500 MB actual / ~3,200 MB limits).
#   Deferred workers start with: --profile deferred (adds ~896 MB limits).
#   Google Maps scraper starts with: --profile scraper (adds ~256 MB limits).
#
# Memory limits (compose enforced):
#   postgres: 1GB, redis: 512MB, api: 512MB, nginx: 64MB
#   Each worker: 128MB
#
# Frontend is deployed to Vercel; this compose file runs API + workers only.
# The shared Caddy container (ig-viewer_web network) handles TLS and proxies
# to signalforge-nginx on port 80. The 127.0.0.1:4080 binding is kept for
# local health checks on the VPS but is NOT how Caddy reaches nginx.

services:
  # ── Data Services ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-signalforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-signalforge} -d ${POSTGRES_DB:-signalforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signalforge-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', '--appendonly', 'yes', '--maxmemory', '384mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application Services ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: signalforge-api:latest
    container_name: signalforge-api
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      IMPORT_DATA_DIR: /data/imports
    volumes:
      - import_data:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: signalforge-nginx
    restart: unless-stopped
    ports:
      - '127.0.0.1:4080:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - signalforge-net
      - caddy
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Workers (shared image, different commands) ───────────────────────────────
  email-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    image: signalforge-workers:latest
    container_name: signalforge-email-worker
    restart: unless-stopped
    command: ['node', 'workers/email-worker/dist/index.js']
    env_file: [.env.production]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 128M

  import-worker:
    image: signalforge-workers:latest
    container_name: signalforge-import-worker
    restart: unless-stopped
    command: ['node', 'workers/import-worker/dist/index.js']
    env_file: [.env.production]
    environment:
      IMPORT_DATA_DIR: /data/imports
      # Keep V8's heap inside the container limit: by default it sizes the heap
      # from host memory and gets OOM-killed by the cgroup before ever GC'ing.
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - import_data:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - signalforge-net
    deploy:
      resources:
        limits:
          memory: 1024M

  scheduler-worker:
    image: signalforge-workers:latest
    container_name: signalforge-scheduler-worker
    restart: unless-stopped
    command: ['node', 'workers/scheduler-worker/dist/index.js']
    env_file: [.env.production]
    depends_on:
