services:
  postgres:
    image: postgres:16-alpine
    container_name: signalforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
      POSTGRES_DB: signalforge
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signalforge -d signalforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signalforge-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-signalforge-redis}']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-signalforge-redis}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    profiles:
      - mailpit
    image: axllent/mailpit:latest
    container_name: signalforge-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  google-maps-scraper:
    profiles:
      - scraper
    image: gosom/google-maps-scraper:v1.18.1
    container_name: signalforge-google-maps-scraper
    restart: unless-stopped
    ports:
      - '${GOOGLE_MAPS_SCRAPER_PORT:-8080}:8080'
    command: ['-web', '-data-folder', '/gmapsdata']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/api/v1/jobs']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
