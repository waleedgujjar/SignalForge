upstream api_backend {
    server api:4000;
}

# ── HTTP Server ──────────────────────────────────────────────────────────────
# Caddy terminates TLS on the host and proxies to this nginx at 127.0.0.1:4080.
# Nginx handles rate limiting and forwards requests to the Fastify API.
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy headers (shared across all locations)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;

    # Health check — unauthenticated, for external monitoring
    location = /health {
        proxy_pass http://api_backend/health;
    }

    # Public unsubscribe endpoint — no auth, no rate limit prefix strip
    location /unsubscribe {
        proxy_pass http://api_backend/unsubscribe;
    }

    # Auth routes — stricter rate limit
    location /auth/ {
        limit_req zone=api_auth burst=3 nodelay;
        proxy_pass http://api_backend/auth/;
    }

    # All other API routes
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://api_backend;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
